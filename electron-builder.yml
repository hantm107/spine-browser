appId: local.spine-browser
productName: Spine Browser
asar: true
directories:
  output: dist
files:
  - src/**/*
  - vendor/**/*
  - package.json
  - README.md
  - LICENSE
win:
  target:
    - target: portable
      arch:
        - x64
  signAndEditExecutable: false
portable:
  artifactName: Spine-Browser-${version}-portable.exe
